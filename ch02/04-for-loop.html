<html>
  <head>
    <title>for 반복문 (for loop)</title>
  </head>
  <body>
    <div id="output"></div>
  </body>
  <script>

    // for문의 세 박자: (시작값 변수 선언 및 할당; 참일 동안 반복하는 조건; 한 바퀴 끝날 때 값의 변화)
    let sum = 0;
    for (let i = 1; i <= 10; i++) {
      sum = sum + i;
      console.log(`i=${i}일 때, 지금까지의 합은 ${sum}이다.`);
    }
    console.log("1부터 10까지 총합=", sum);

    let hey = 0;
    for (let i = 1; i <= 10; i = i + 2) { // i += 2 로 쓰면 간단!
      hey = hey + i;
      console.log(`i=${i}일 때, 지금까지의 합은 ${hey}이다.`);
    }
    console.log("1부터 10까지 총합=", hey);

    // for...of 문: 배열의 항목을 하나씩 꺼내며 반복
    const menus = ['삼각김밥', '라면', '치즈김밥'];

    for (const menu of menus) {
      console.log("-", menu);
    }

    // while문: 조건이 참인 동안 계속 반복한다. 반복횟수를 잘 모를 때 유용하다.
    let countdown = 5;
    while (countdown > 0) {
      console.log(`${countdown}...`);
      countdown--;
    }
    console.log("발사!");

    // 50부터 200까지 더한 값을 출력해보자.
    // for문
    let sum2 = 0;
    for (let i = 50; i <= 200; i++) {
      sum2 = sum2 + i;
    }
    console.log("최종 합은", sum2);

    // while문
    let num = 50;
    let whileSum = 0;
    while (num <= 200) {
      whileSum += num;
      num++;
    }
    console.log(whileSum);

    // 1부터 50까지 숫자 중에서 3의 배수만 출력하자.
    for (let i = 1; i*3 <= 50; i++) {
      console.log(i*3);
    }

    for (let i = 1; i <= 50; i++) {
      if (i % 3 === 0) {
        console.log(i);
      }
    }

    // 1부터 10까지 더하는데 더한 값이 30을 넘으면 거기서 멈추고 종료
    let sum3 = 0;
    for (let i = 1; i <= 10; i++) {
      sum3 = sum3 + i;
      if (sum3 > 30) {
        break;
      }
      console.log(i, sum3);
    }

    // 1부터 10까지 홀수만 더하기
    let oddSum = 0;
    for (let i = 1; i <= 10; i++) {
      if (i % 2 === 0) {
        continue;
      }
      oddSum = oddSum + i;
      console.log(i, oddSum);
    }

  </script>
</html>
