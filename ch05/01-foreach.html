<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const numbers = [1, 2, 3, 4];
    // doubleNum 변수에 numbers 배열의 원소에 각각 2를 곱하여 만든 배열을 할당하라.

    const doubleNum = [];
    for (let i = 0; i < numbers.length; i++){
      doubleNum.push(numbers[i] * 2);
    }

    const doubleNum2 = numbers.map(
      i => i * 2
    );

    const doubleNum3 = numbers.map(
      x => x + 5
    );

    // 연습문제 1. 아래 상품 정보에서 각 상품의 가격을 10% 할인한 새로운 가격과 함께 {name, originalPrice, discountedPrice} 형태로 변환하시오.
    const products = [
      {name: 'Laptop', price: 1000},
      {name: 'Phone', price: 500},
      {name: 'Tablet', price: 300}
    ];

    const discountedProducts = products.map(
      (product) => {
        const discountedProduct = {
          name: product.name,
          originalPrice: product.price,
          discountedPrice: product.price * 0.9
        }
        return discountedProduct;
      }
    );
      console.log(discountedProducts);

    // 연습문제 2. 여행 예약 정보를 받았는데, 각 예약을 읽기 좋게 문자열로 변환하시오.
    // 형식: "[이름] 예약: 2024년 3월 15일 (3박)"
      // 풀이 1)
      const bookings = [
        {guest: 'Alice', date: '2024-03-15', nights: 3},
        {guest: 'Bob', date: '2024-07-22', nights: 5},
        {guest: 'Charlie', date: '2024-12-01', nights: 2}
      ];

      const bookingsInStrings = bookings.map(
        booking => {
          let newDate = new Date(booking.date); // 날짜 값을 날짜형으로 변환
          let formattedNewDate = `${newDate.getFullYear()}년 ${newDate.getMonth() + 1}월 ${newDate.getDate()}일`; // 함수호출할때 뒤에 () 붙이는거 까먹지말자.... & getMonth는 0부터 시작인거!
          const bookingInStrings = `${booking.guest} 예약: ${formattedNewDate} (${booking.nights}박)`;
          return bookingInStrings;
        }
      )

      console.log(bookingsInStrings);

      // 풀이 2)
      // 혹은 string함수 활용하기 & 구조분해할당
      const bookingWithStringFunction = bookings.map(
        booking => {
          const dateArray = booking.date.split('-'); // ['2024', '03', '15']와 같은 배열
          const [year, month, date] = dateArray;
          const newDate = `${year}년 ${month}월 ${date}일`;
          const bookingInStrings = `${booking.guest} 예약: ${newDate} (${booking.nights}박)`;
          return bookingInStrings;
        }
      )
      
      console.log(bookingWithStringFunction);
      
    // 연습문제 3. 학생 점수 데이터에서 각 학생의 최고점과 평균점을 계산해서 {name, highestScore, average} 형태로 만들어서 반환하시오. (소수점 둘째 자리까지 반올림)
    const students = [
      {name: 'Alice', scores: [85, 92, 78]},
      {name: 'Bob', scores: [95, 88, 91]},
      {name: 'Charlie', scores: [72, 75, 68]}
    ];

    const calculatedStudents = students.map(
      student => {
        let sum = 0;
        student.scores.forEach(score => {
          sum += score;
        })
        const mean = sum / student.scores.length;
        const max = Math.max(...student.scores); // 배열이므로 값만 흩어주는 스프레드 활용
        const studentObj = {
          name: student.name,
          highestScore: max,
          average: parseFloat(mean.toFixed(2)), // toFixed()는 문자열 반환!!!
        }
        return studentObj;
      }
    )

    console.log(calculatedStudents);

  </script>
</body>
</html>
