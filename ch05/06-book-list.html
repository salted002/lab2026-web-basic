<html>
  <body>
    <script>
      const books = [
        { title: '해리포터', page: 320, genre: '판타지' },
        { title: '1984', page: 328, genre: 'SF' },
        { title: '어린 왕자', page: 154, genre: '동화' },
        { title: '데미안', page: 290, genre: '소설' },
        { title: '삼대', page: 520, genre: '고전' },
        { title: '헤일메리 프로젝트', page: 811, genre: 'SF' },
        { title: '꿈꾸는 책들의 도시', page: 540, genre: '판타지' },
      ]

      // 1. 장르가 SF인 도서를 새 배열로
      const sfBooks = books.filter((b) => b.genre === 'SF')
      console.log(sfBooks)

      // 2. SF 책의 제목만 새 배열로
      const sfBooksTitle = sfBooks.map((b) => b.title)
      console.log(sfBooksTitle)

      // 3. SF 책들의 총 페이지 수
      const totalPageOfSf = sfBooks.reduce((acc, cur) => {
        return acc + cur.page
      }, 0)
      console.log(totalPageOfSf)

      // 4. SF 책들의 제목과 페이지 수를 새 배열로 출력,
      // ["1984 (328p)", "해리포터 (320p)"]
      const sfTitlePage = sfBooks.map((b) => `${b.title} (${b.page}p)`)
      console.log(sfTitlePage)

      // 5. 새로운 책 넣어서 새 배열
      // 눈물을 마시는 새, 페이지 800, 장르 판타지
      const updatedBooks = [
        ...books,
        {
          title: '눈물을 마시는 새',
          page: 800,
          genre: '판타지',
        },
      ]
      console.log(updatedBooks)
    </script>
  </body>
</html>
