<html>
  <head>
    <title>fetch 목록 그리기</title>
  </head>
  <body>
    <h1 id="userStatus">사용자 목록 불러오는 중...</h1>
    <ul id="userList"></ul>
    <h1 id="commentStatus">댓글 목록 불러오는 중...</h1>
    <ul id="commentList"></ul>
    <h1 id="postStatus">게시글 목록 불러오는 중...</h1>
    <ul id="postList"></ul>
    <script>
      const userStatusElement = document.getElementById('userStatus')
      const userListElement = document.getElementById('userList')
      const postStatusElement = document.getElementById('postStatus')
      const postListElement = document.getElementById('postList')
      const commentStatusElement = document.getElementById('commentStatus')
      const commentListElement = document.getElementById('commentList')

      async function loadUsers() {
        try {
          const response = await fetch(
            'https://jsonplaceholder.typicode.com/users',
          )
          const users = await response.json()
          console.log('받아온 사용자들:', users)

          userStatusElement.textContent = `사용자 ${users.length}명을 불러왔습니다.`

          users.forEach((user) => {
            const li = document.createElement('li')
            li.textContent = `${user.name} (${user.email})`
            userListElement.appendChild(li)
          })
        } catch (error) {
          console.log('실패:', error)
          userStatusElement.textContent = '사용자 목록을 불러오지 못했습니다.'
        }
      }
      loadUsers()

      async function loadPosts() {
        try {
          const response = await fetch(
            'https://jsonplaceholder.typicode.com/posts',
          )
          const posts = await response.json()
          console.log('받아온 게시글들:', posts)

          postStatusElement.textContent = `게시글 ${posts.length}개를 불러왔습니다.`

          posts.forEach((post) => {
            const li = document.createElement('li')
            li.textContent = `${post.title} (${post.userId}: {${post.id}})`
            postListElement.appendChild(li)
          })
        } catch (error) {
          console.log('실패:', error)
          postStatusElement.textContent = '게시글 목록을 불러오지 못했습니다.'
        }
      }
      loadPosts()

      async function loadComments() {
        try {
          const response = await fetch(
            'https://jsonplaceholder.typicode.com/comments',
          )
          const comments = await response.json()
          console.log('받아온 댓글들:', comments)

          commentStatusElement.textContent = `총 댓글 ${comments.length}개 중 10개를 불러왔습니다.`

          const tenComments = comments.slice(0, 10)
          tenComments.forEach((comment) => {
            const li = document.createElement('li')
            li.textContent = `${comment.email} | ${comment.body}`
            commentListElement.appendChild(li)
          })
        } catch (error) {
          console.log('실패:', error)
          commentStatusElement.textContent = '댓글 목록을 불러오지 못했습니다.'
        } // body email id name postId
      }
      loadComments()
    </script>
  </body>
</html>
