<html>
  <head>
    <title>1장 - 자바스크립트 콘솔</title>
  </head>
  <body>
    <p>개발자 도구: 콘솔에서 console.log를 확인하세요.</p>
    <script>
      console.log('Hello World');
      console.log(2026, "안녕하세유 첫번째 콘솔로그입니다");
      // 자바스크립트 주석은 슬래시 2개~
      /*
        긴줄주석은 이렇게.
      */
      // 출력값을 쉽표로 끊으면 띄어쓰기가 자동으로 들어간다.
      console.log("정시원");
      console.log(2026 + "년");
      console.log("저는", 30 + "살입니다.")
      // 개발 완료 후 콘솔로그를 꼭 지워야 한다~ 다들 까묵는다~
      console.log(false, true)
      console.log("좋아하는", "음식은", "파스타", "입니다.");
      const foodText = "좋아하는 음식은";
      const endText = "입니다.";
      let food = "김치찌개";
      console.log(foodText, food, endText);
    </script>
  </body>
</html>
